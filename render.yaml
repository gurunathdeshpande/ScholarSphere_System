services:
  # Backend Service
  - type: web
    name: scholarsphere-backend
    env: docker
    region: oregon
    plan: free
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_APP
        value: run.py
      # SECRET: Set this in Render Dashboard Environment Variables
      # - key: DATABASE_URL
      #   value: mysql+mysqldb://avnadmin:PASSWORD@HOST:PORT/defaultdb?ssl-mode=REQUIRED
    healthCheckPath: /

  # Frontend Service
  - type: web
    name: scholarsphere-frontend
    env: docker
    region: oregon
    plan: free
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://scholarsphere-backend.onrender.com/api # Placeholder: Update with actual backend URL after deployment

