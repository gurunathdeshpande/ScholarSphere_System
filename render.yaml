services:
  # Backend Service
  - type: web
    name: scholarsphere-backend
    env: docker
    region: oregon
    plan: free
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_APP
        value: run.py
    # Health check path (adjust if you have /health or similar)
    healthCheckPath: /

  # Frontend Service
  - type: web
    name: scholarsphere-frontend
    env: docker
    region: oregon
    plan: free
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://scholarsphere-backend.onrender.com/api # Placeholder: Update with actual backend URL after deployment

