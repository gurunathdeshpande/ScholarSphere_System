version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=run.py
      - DATABASE_URL=mysql+mysqldb://root:root@db/scholarsphere
      # Ensure backend waits for DB if possible, or handles retry. 
      # For simplicity here, we rely on restart: always to retry connection.
    depends_on:
      - db
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: scholarsphere
    ports:
      - "3306:3306"
    restart: always
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
